name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

    - name: Build with PyInstaller
      run: |
        py -m PyInstaller --noconfirm --onedir --windowed --icon="app_icon.ico" --name="HEIC Converter Studio" heic_converter.py

    - name: Copy Extra Assets
      run: |
        xcopy app_icon.ico "dist\HEIC Converter Studio\" /Y
        xcopy avatar.png "dist\HEIC Converter Studio\" /Y

    - name: Archive Build
      run: |
        Compress-Archive -Path "dist\HEIC Converter Studio" -DestinationPath "HEIC-Converter-Studio-${{ github.ref_name }}.zip"

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: HEIC-Converter-Studio-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}